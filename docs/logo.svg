<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="24" fill="#111"/>

  <!-- waveform bars — left side -->
  <g fill="#e0e0e0">
    <rect x="42" y="82" width="5" height="36" rx="2.5"/>
    <rect x="52" y="70" width="5" height="60" rx="2.5"/>
    <rect x="62" y="60" width="5" height="80" rx="2.5"/>
    <rect x="72" y="72" width="5" height="56" rx="2.5"/>
  </g>

  <!-- fingerprint arc — center -->
  <g fill="none" stroke="#e0e0e0" stroke-width="2.5" stroke-linecap="round">
    <path d="M100,58 Q120,58 120,80 Q120,90 110,95"/>
    <path d="M100,68 Q112,68 112,80 Q112,86 106,89"/>
    <path d="M100,78 Q106,78 106,84"/>
  </g>

  <!-- microphone dot -->
  <circle cx="100" cy="105" r="4" fill="#e0e0e0"/>

  <!-- waveform bars — right side -->
  <g fill="#e0e0e0">
    <rect x="123" y="72" width="5" height="56" rx="2.5"/>
    <rect x="133" y="60" width="5" height="80" rx="2.5"/>
    <rect x="143" y="70" width="5" height="60" rx="2.5"/>
    <rect x="153" y="82" width="5" height="36" rx="2.5"/>
  </g>

  <!-- text -->
  <text x="100" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#e0e0e0" letter-spacing="3">GCV</text>
</svg>
